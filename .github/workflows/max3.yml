name: build-max3-uboot

on:
  workflow_dispatch:
  push:
    paths:
      - 'board/ralink/**'
      - 'failsafe/**'
      - 'include/configs/**'
      - 'common/autoboot.c'
      - 'configs/mt7621_max3_defconfig'
      - 'max3_build.sh'
      - '.github/workflows/max3.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "nproc=$(nproc)"
          free -m | head -n2
          df -h . | tail -n1
          make --version | head -n1
          gcc --version | head -n1

      - name: 安装宿主依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex bc uuid-dev libssl-dev xz-utils python3 python-is-python3 wget

      - name: 拉取工具链
        run: |
          mkdir -p tc
          wget -q -O tc.tar.xz https://github.com/DragonBluep/uboot-mt7621/releases/download/20230517/openwrt-toolchain-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar --xz -xf tc.tar.xz -C tc
          TC=$(ls -d tc/*/toolchain-mipsel*/bin | head -n1)
          echo "TC=$TC"
          echo "$TC" > tc_path.txt
          "$TC/mipsel-openwrt-linux-gcc" --version | head -n1

      - name: 构建
        run: |
          set -o pipefail
          PREFIX="$(cat tc_path.txt)/mipsel-openwrt-linux-"
          echo "PREFIX=$PREFIX"
          chmod +x max3_build.sh
          stdbuf -oL -eL ./max3_build.sh "$PREFIX" 2>&1 | tee build.log \
            | awk '/Error in reading or end of file/ { n++; if (n<=3) print; next } { print }'
          echo "---- 日志末尾 ----"
          tail -n 40 build.log

      - name: 生成可直接烧写的镜像（改名 + 补齐 0xFF）
        run: |
          python3 - <<'PY'
          import os, struct, zlib, hashlib

          NAME = b"U-Boot 2018.09 for mt7621_nand_r"
          ALIGN = 2048
          REGION = 0x40000

          cands = ["dist/u-boot-lzma-v3.img", "dist/u-boot-lzma.img", "u-boot-lzma.img"]
          src = next((p for p in cands if os.path.isfile(p)), None)
          if src is None:
              raise SystemExit("找不到 u-boot-lzma 产物")

          d = bytearray(open(src, "rb").read())
          if struct.unpack(">I", bytes(d[:4]))[0] != 0x27051956:
              raise SystemExit("%s 不是 uImage" % src)

          old = bytes(d[32:64]).decode("latin-1").rstrip()
          d[32:64] = NAME + b"\x00" * (32 - len(NAME))
          d[4:8] = b"\x00\x00\x00\x00"
          d[4:8] = struct.pack(">I", zlib.crc32(bytes(d[:64])) & 0xFFFFFFFF)

          size = struct.unpack(">I", bytes(d[12:16]))[0]
          if len(d) < 64 + size:
              raise SystemExit("data 区不足，头里 size=%d" % size)

          pad = (-len(d)) % ALIGN
          out = bytes(d) + b"\xff" * pad
          if len(out) > REGION:
              raise SystemExit("超出块 1-2 容量：%d > %d" % (len(out), REGION))

          dst = "dist/u-boot-lzma-v3-named-pad.bin"
          open(dst, "wb").write(out)

          print("源     ", src)
          print("name   ", old, "->", NAME.decode())
          print("hcrc    0x%08X" % struct.unpack(">I", out[4:8])[0])
          print("大小    %d B（补 %d B 0xFF）" % (len(out), pad))
          print("页数    %d" % (len(out) // ALIGN))
          print("sha256  %s" % hashlib.sha256(out).hexdigest())
          PY

      - name: 归档产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max3-uboot-lzma
          path: |
            dist/
            build.log
            u-boot.bin
            u-boot.map
            u-boot
          if-no-files-found: warn
